
name: Build XED PvP MAX

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q XED_PvP_MAX_0.2.0_source.zip -d extracted



      - name: Build mod
        shell: bash
        run: |
          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found"
            exit 1
          fi

          sed -i \
            's/RepositoriesMode.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g; s/RepositoriesMode.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' \
            "$SETTINGS"

          PROJECT_DIR=$(dirname "$SETTINGS")
          cd "$PROJECT_DIR"

          gradle build --no-daemon


          cd "$PROJECT_DIR"
          gradle build --no-daemon


      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: xed-pvp-max-jars
          path: extracted/XED_PvP_MAX_Fabric_Project/build/libs/*.jar
          if-no-files-found: error
