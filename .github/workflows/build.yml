
name: Build XED PvP MAX

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Extract and prepare project
        shell: bash
        run: |
          mkdir -p extracted
          unzip -o XED_PvP_MAX_0.2.0_source.zip -d extracted

          FILE=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: Gradle settings file missing"
            exit 1
          fi

          DIR=$(dirname "$FILE")

          sed -i -E \
            's/repositoriesMode.set\(RepositoriesMode\.[A-Z_]+\)/repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)/' \
            "$FILE"

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Build XED
        run: |
          cd "$PROJECT_DIR"
          gradle build --no-daemon

      - name: Upload XED JAR
        uses: actions/upload-artifact@v4
        with:
          name: XED-PvP-MAX-0.2.0
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
