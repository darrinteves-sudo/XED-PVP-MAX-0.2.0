
name: Build XED PvP MAX

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Find project and build
        shell: bash
        run: |
          PROJECT_DIR=$(find . -type f -name settings.gradle \
            -not -path '*/.gradle/*' \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found!"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Building project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: xed-pvp-max-0.2.0
          path: '**/build/libs/*.jar'
          if-no-files-found: error
